<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vampire Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      body {
        font-family: "JetBrains Mono", monospace;
      }

      #root {
        position: fixed;
        inset: 0;
      }

      .status {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        max-width: min(420px, calc(100vw - 32px));
        padding: 10px 12px;
        color: #f4f7fb;
        font-size: 12px;
        line-height: 1.5;
        background: rgba(7, 10, 16, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 12px;
        backdrop-filter: blur(14px);
      }

      .status.hidden {
        display: none;
      }

      .status.error {
        color: #ffd5d5;
        border-color: rgba(248, 113, 113, 0.42);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.0.0/spark.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="status" class="status">Loading vampire.sog...</div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

      const root = document.getElementById("root");
      const status = document.getElementById("status");

      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#000000");

      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.01,
        1000,
      );
      camera.up.set(0, -1, -0.6);
      camera.position.set(-0.93, 0.0, -15.97);
      camera.lookAt(2.6, 0.6, 9.3);

      const renderer = new THREE.WebGLRenderer({
        antialias: false,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      root.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true;
      controls.minDistance = 1;
      controls.maxDistance = 80;
      controls.target.set(2.6, 0.6, 9.3);
      controls.update();

      const spark = new SparkRenderer({ renderer });
      scene.add(spark);

      const setStatus = (message, isError = false) => {
        status.textContent = message;
        status.classList.toggle("error", isError);
        status.classList.remove("hidden");
      };

      const formatProgress = (event) => {
        if (!event) return "Loading splats...";
        if (event.lengthComputable && event.total > 0) {
          const percent = Math.round((event.loaded / event.total) * 100);
          return `Loading vampire.sog... ${percent}%`;
        }
        if (typeof event.loaded === "number" && event.loaded > 0) {
          const mb = (event.loaded / (1024 * 1024)).toFixed(1);
          return `Loading vampire.sog... ${mb} MB`;
        }
        return "Initializing Spark viewer...";
      };

      const splats = new SplatMesh({
        url: "../assets/model/vampire.sog",
        lod: true,
        onProgress: (event) => {
          setStatus(formatProgress(event));
        },
      });

      splats.quaternion.set(0, 0, 0, 1);
      splats.position.set(0, 1, 0);
      splats.scale.setScalar(1.5);
      scene.add(splats);

      const onResize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      };

      window.addEventListener("resize", onResize);

      const init = async () => {
        try {
          await splats.initialized;
          setStatus("Loaded. Drag to orbit, scroll to zoom.");
          window.setTimeout(() => {
            status.classList.add("hidden");
          }, 1400);
        } catch (error) {
          console.error("Spark viewer init failed:", error);
          const message =
            error instanceof Error ? error.message : String(error);
          setStatus(`Spark viewer init failed: ${message}`, true);
        }
      };

      renderer.setAnimationLoop(() => {
        controls.update();
        renderer.render(scene, camera);
      });

      init();
    </script>
  </body>
</html>
